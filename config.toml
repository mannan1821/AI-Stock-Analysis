[theme]
base = "dark"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#191918"
textColor = "#ffffff"
primaryColor = "#ff0000"

[client]
# "minimal" removes the hamburger menu entirely (Settings -> theme picker,
# Rerun, Clear cache, Deploy, etc.), which is the only place a light theme
# could be selected from - so there is no in-app way to switch off dark mode.
toolbarMode = "minimal"
